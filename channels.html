<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AYAN IPTV</title>

<style>
body{
background:#000;
color:white;
font-family:Arial;
text-align:center;
}

button{
display:block;
width:95%;
margin:5px auto;
padding:10px;
border-radius:8px;
background:#222;
color:white;
border:1px solid #555;
}
</style>

</head>

<body>

<h1 style="color:red">AYAN IPTV</h1>

<div id="channels"></div>

<script>

const box = document.getElementById("channels");

const saved = JSON.parse(localStorage.getItem("iptv"));

if(!saved){
location.href="index.html";
}

const server = saved.server;
const username = saved.username;
const password = saved.password;


const url =
`/.netlify/functions/proxy?server=${encodeURIComponent(server)}/player_api.php?username=${username}&password=${password}&action=get_live_streams`;


fetch(url)

.then(res=>res.json())

.then(data=>{

box.innerHTML="";

data.forEach(ch=>{

let btn=document.createElement("button");

btn.innerHTML=ch.name;


btn.onclick=()=>{

location.href=
"player.html?url="+
encodeURIComponent(
`${server}/live/${username}/${password}/${ch.stream_id}.m3u8`
);

};


box.appendChild(btn);

});

})

.catch(err=>{

console.log(err);

box.innerHTML="خطأ في الاتصال بالسيرفر";

});


</script>

</body>
</html>
