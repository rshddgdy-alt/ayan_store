<div id="channels"></div>

<script>

const box = document.getElementById("channels");
const saved = JSON.parse(localStorage.getItem("ayan_user"));

if(!saved){
    location.href="index.html";
}

const server = saved.server;
const username = saved.username;
const password = saved.password;
const url =
`/.netlify/functions/proxy?server=${encodeURIComponent(server)}&user=${username}&pass=${password}`;

fetch(url)
.then(res => res.json())
.then(data => {

console.log(data);

box.innerHTML = "";
if(!Array.isArray(data)){
    box.innerHTML = JSON.stringify(data);
    return;
}

data.forEach(ch => {
let btn = document.createElement("button");
btn.style.display = "block";
btn.style.width = "95%";
btn.style.margin = "5px auto";
btn.style.padding = "10px";
btn.style.borderRadius = "8px";
btn.style.background = "#222";
btn.style.color = "white";
btn.style.border = "1px solid #555";
btn.innerHTML = ch.name;

btn.onclick = ()=>{

location.href =
"player.html?url=" +
encodeURIComponent(
`${server}/live/${username}/${password}/${ch.stream_id}.m3u8`
);


box.appendChild(btn);

});

})
.catch(err=>{
console.log(err);
box.innerHTML="خطأ في الاتصال بالسيرفر";
});

</script>
