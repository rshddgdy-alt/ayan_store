<script>
const user = JSON.parse(localStorage.getItem("ayan_user"));

if(!user){
  window.location.href="index.html";
}

const box = document.getElementById("channels");

box.innerHTML = "جاري تحميل القنوات...";

const m3u = `http://tv.business-cloud-8.ru/get.php?username=${user.username}&password=${user.password}&type=m3u_plus&output=ts`;

fetch(m3u)
.then(res => res.text())
.then(text => {

box.innerHTML="";

let lines = text.split("\n");

for(let i=0;i<lines.length;i++){

 if(lines[i].startsWith("#EXTINF")){

  let name = lines[i].split(",")[1] || "قناة";

  let url = lines[i+1];

  let btn = document.createElement("button");

  btn.innerHTML = name;

  btn.onclick = ()=>{
   window.location.href="player.html?url="+encodeURIComponent(url);
  };

  box.appendChild(btn);
 }

}

})
.catch(err=>{
 console.log(err);
 box.innerHTML="خطأ في تحميل القنوات";
});
</script>
