<div id="channels"></div>

<script>

const box = document.getElementById("channels");

const user = JSON.parse(localStorage.getItem("ayan_user"));

const server = user.server;
const username = user.username;
const password = user.password;

const url =
`/.netlify/functions/proxy?server=${encodeURIComponent(server)}&user=${username}&pass=${password}`;

fetch(url)
.then(res => res.json())
.then(data => {

box.innerHTML = "";

data.forEach(ch => {

let btn = document.createElement("button");

btn.innerHTML = ch.name;

btn.onclick = ()=>{

location.href =
"player.html?url=" +
encodeURIComponent(
`${server}/live/${username}/${password}/${ch.stream_id}.ts`
);

};

box.appendChild(btn);

});

})
.catch(err=>{
console.log(err);
box.innerHTML="خطأ في الاتصال بالسيرفر";
});

</script>
