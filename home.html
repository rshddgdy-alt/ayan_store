<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYAN_STORE</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma, Arial;
}

body{
    margin:0;
    background:#080a10;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:90%;
    max-width:420px;
    background:#151821;
    padding:35px;
    border-radius:25px;
    box-shadow:0 0 30px #000;
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    color:#ff9800;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#aaa;
    margin-bottom:35px;
}

label{
    display:block;
    margin:15px 0 8px;
    color:#ddd;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #333;
    background:#202430;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#ff9800;
}

button{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#ff9800;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e68900;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#666;
    font-size:13px;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">
AYAN_STORE
</div>

<div class="sub">
منصة الترفيه الرقمي
</div>


<label>رابط السيرفر (DNS)</label>
<input placeholder="http://example.com:8080">


<label>اسم المستخدم</label>
<input placeholder="Username">


<label>كلمة المرور</label>
<input type="password" placeholder="Password">


<button>
تسجيل الدخول
</button>


<div class="footer">
Powered by AYAN_STORE
</div>

</div>

</body>
</html>
