<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>IPTV Player</title>

<style>
body{
background:#000;
color:white;
text-align:center;
font-family:Arial;
}

h1{
color:red;
}

video{
width:95%;
height:70vh;
background:#111;
margin-top:20px;
}
</style>

</head>

<body>

<h1>AYAN IPTV</h1>

<video id="video" controls autoplay></video>

<script>

const params = new URLSearchParams(window.location.search);

const url = params.get("url");

if(url){

let video = document.getElementById("video");

if(Hls.isSupported()){

let hls = new Hls();
hls.loadSource(url);
hls.attachMedia(video);

}else{

video.src = url;

}

}else{
