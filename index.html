<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAN STORE - IPTV Platform</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f1015;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #1a1c23;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #ff9800;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #252833;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #e68900;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>AYAN STORE</h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 20px;">منصة الترفيه الرقمي</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>رابط السيرفر (DNS)</label>
                <input type="text" id="serverUrl" placeholder="http://example.com:8080" required>
            </div>
            <div class="input-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور (Password)</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const server = document.getElementById('serverUrl').value.trim();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            // رابط توجيه البث المباشر عبر Xtream API
            const targetUrl = `${server}/live/${user}/${pass}/`;
            alert("جاري الاتصال بالسيرفر وتحميل القنوات...");
            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
